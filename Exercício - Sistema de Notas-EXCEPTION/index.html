<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
</head>
<body>
    <main>
        <h1>Sistema de Notas</h1>
        <p>Digite as três notas do aluno para calcular a média.</p>

        <section>
            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="any" placeholder="Ex.: 8">
            <br>

            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="any" placeholder="Ex.: 7,5">
            <br>

            <label for="nota3">Terceira nota:</label>
            <input type="number" id="nota3" min="0" max="10" step="any" placeholder="Ex.: 9">
            
            <button type="button" id="calcular">Calcular média</button>
            <p id="resultadoMedia" aria-live="polite"></p>
            <p id="finalizacaoMedia" class="finalizacao"></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
